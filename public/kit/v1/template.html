<!doctype html>
<!-- Bad Omen kit v1: starter page. Copy kit/v1 next to it and replace the NAME and the copy. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAME &middot; Bad Omen</title>
<meta name="description" content="One deadpan line about NAME.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0c">
<link rel="preload" href="kit/v1/fonts/pirata-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="kit/v1/fonts/geist-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="kit/v1/tokens.css">
<link rel="stylesheet" href="kit/v1/footer.css">
<style>
  body {
    margin: 0;
    background: var(--bo-ink);
    color: var(--bo-bone);
    font: 400 var(--bo-text-body)/1.6 var(--bo-sans);
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: var(--bo-wrap);
    margin: 0 auto;
    padding: var(--bo-section) var(--bo-gut) 0;
  }
  .pre {
    margin: 0;
    font: var(--bo-text-label)/1.4 var(--bo-mono);
    letter-spacing: var(--bo-track-label);
    text-transform: uppercase;
    color: var(--bo-ash-lt);
  }
  h1 {
    margin: var(--bo-space-2) 0 var(--bo-space-4);
    font: 400 var(--bo-text-h2)/.95 var(--bo-display);
  }
  .lede { max-width: 34ch; font-size: var(--bo-text-lede); color: var(--bo-bone-2); }
</style>
</head>
<body>
<main>
  <p class="pre">A Bad Omen project.</p>
  <h1>NAME</h1>
  <p class="lede">The plain fact. Then one dry line after it.</p>
</main>

<footer class="bo-foot">
  <p>All rights reserved. Several wrongs, too.</p>
  <div class="bo-foot-band">
    <p class="bo-foot-mark">A Bad Omen project &middot; <a href="https://bad.llc">bad.llc</a></p>
    <nav class="bo-foot-nav" aria-label="Bad Omen projects">
      <ul>
        <li><a href="https://bad.llc">bad.llc</a></li>
        <li><a href="https://cassie.sh">cassie.sh</a></li>
        <li><a href="https://carrie.sh">carrie.sh</a></li>
        <li><a href="https://github.com/saltyfireball/orca">Orca</a></li>
      </ul>
    </nav>
  </div>
</footer>
</body>
</html>
